<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#080b09" />
    <meta name="description" content="BlockPilot - a fast, private Minecraft launcher with offline and ely.by accounts, skins, capes, mods and multi-instance workspaces." />
    <title>BlockPilot</title>
    <style>
      html, body { margin:0; padding:0; background:#080b09; }
      #splash {
        position: fixed; inset: 0; z-index: 9999;
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        gap: 18px;
        background: radial-gradient(circle at 50% 30%, #10241533, transparent 60%), #080b09;
        font-family: 'Space Grotesk', system-ui, sans-serif;
        transition: opacity .45s ease, visibility .45s ease;
      }
      #splash.hidden { opacity: 0; visibility: hidden; pointer-events: none; }
      .splash-cube {
        width: 46px; height: 46px;
        background: linear-gradient(145deg, #a5f579, #4ca83a);
        clip-path: polygon(50% 0, 100% 25%, 100% 75%, 50% 100%, 0 75%, 0 25%);
        animation: splashPulse 1.4s ease-in-out infinite;
      }
      .splash-word { color: #e9eee9; font-weight: 700; font-size: 15px; letter-spacing: .16em; }
      .splash-sub { color: #87928a; font-size: 10px; letter-spacing: .12em; margin-top: -10px; }
      .splash-bar { width: 160px; height: 3px; border-radius: 3px; background: #121914; overflow: hidden; }
      .splash-bar i { display:block; height:100%; width: 40%; background: #76d34b; border-radius: 3px; animation: splashLoad 1.1s ease-in-out infinite; }
      @keyframes splashPulse { 0%,100% { transform: scale(1); opacity: 1; } 50% { transform: scale(.88); opacity: .75; } }
      @keyframes splashLoad { 0% { transform: translateX(-120%); } 100% { transform: translateX(360%); } }
    </style>
  </head>
  <body>
    <div id="splash">
      <div class="splash-cube"></div>
      <div class="splash-word">BLOCKPILOT</div>
      <div class="splash-sub">STARTING WORKSPACE…</div>
      <div class="splash-bar"><i></i></div>
    </div>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
