name: Patch launcher
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    if: github.event.head_commit.message != 'Patch launcher UI and loader resolver'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch files
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src-tauri/src/lib.rs')
          s=p.read_text()
          old='''async fn resolve_inherits(client: &reqwest::Client, manifest: &Value, mut meta: Value) -> Result<Value, String> {\n    if let Some(parent_id) = meta.get("inheritsFrom").and_then(Value::as_str).map(str::to_string) {\n        let parent = version_meta(client, manifest, &parent_id).await?;\n        let mut merged = resolve_inherits(client, manifest, parent).await?;\n        for key in ["id","mainClass","type","releaseTime","time","assetIndex","javaVersion"] { if let Some(v)=meta.get(key) { merged[key]=v.clone(); } }\n        for key in ["libraries"] {\n            let mut arr = merged.get(key).and_then(Value::as_array).cloned().unwrap_or_default();\n            if let Some(child) = meta.get(key).and_then(Value::as_array) { arr.extend(child.iter().cloned()); }\n            merged[key]=Value::Array(arr);\n        }\n        if let Some(args) = meta.get("arguments") {\n            let mut merged_args = merged.get("arguments").cloned().unwrap_or_else(|| json!({}));\n            for kind in ["jvm","game"] {\n                let mut arr = merged_args.get(kind).and_then(Value::as_array).cloned().unwrap_or_default();\n                if let Some(child) = args.get(kind).and_then(Value::as_array) { arr.extend(child.iter().cloned()); }\n                if !arr.is_empty() { merged_args[kind]=Value::Array(arr); }\n            }\n            merged["arguments"]=merged_args;\n        }\n        Ok(merged)\n    } else { Ok(meta) }\n}'''
          new='''async fn resolve_inherits(client: &reqwest::Client, manifest: &Value, mut meta: Value) -> Result<Value, String> {\n    let mut chain = Vec::new();\n    loop {\n        let parent = meta.get("inheritsFrom").and_then(Value::as_str).map(str::to_string);\n        chain.push(meta);\n        let Some(parent_id) = parent else { break; };\n        meta = version_meta(client, manifest, &parent_id).await?;\n    }\n    let mut merged = chain.pop().unwrap_or_else(|| json!({}));\n    while let Some(child) = chain.pop() {\n        for key in ["id","mainClass","type","releaseTime","time","assetIndex","javaVersion"] { if let Some(v)=child.get(key) { merged[key]=v.clone(); } }\n        let mut libs = merged.get("libraries").and_then(Value::as_array).cloned().unwrap_or_default();\n        if let Some(extra) = child.get("libraries").and_then(Value::as_array) { libs.extend(extra.iter().cloned()); }\n        if !libs.is_empty() { merged["libraries"]=Value::Array(libs); }\n        let mut merged_args = merged.get("arguments").cloned().unwrap_or_else(|| json!({}));\n        if let Some(args) = child.get("arguments") {\n            for kind in ["jvm","game"] {\n                let mut arr = merged_args.get(kind).and_then(Value::as_array).cloned().unwrap_or_default();\n                if let Some(extra) = args.get(kind).and_then(Value::as_array) { arr.extend(extra.iter().cloned()); }\n                if !arr.is_empty() { merged_args[kind]=Value::Array(arr); }\n            }\n            merged["arguments"]=merged_args;\n        }\n    }\n    Ok(merged)\n}'''
          if old not in s: raise SystemExit('resolve_inherits pattern not found')
          s=s.replace(old,new)
          s=s.replace('match patch { Some(patch) => format!("{}.{}", major.trim_start_matches(\'1\'), patch), None => format!("{}.{minor}", major.trim_start_matches(\'1\')) }','match patch { Some(patch) => format!("{}.{}", major.trim_start_matches(\'1\'), patch), None => format!("{}.0", major.trim_start_matches(\'1\')) }')
          p.write_text(s)

          p=Path('src/App.svelte')
          s=p.read_text()
          s=s.replace("let newInstanceLoader: 'vanilla'|'fabric' = 'vanilla';\n  const comingSoonLoaders = ['forge','neoforge','quilt'];", "let newInstanceLoader: 'vanilla'|'fabric'|'forge'|'neoforge' = 'vanilla';")
          s=s.replace("<option value=\"fabric\">Fabric</option>\n              {#each comingSoonLoaders as l}<option value={l} disabled>{l.charAt(0).toUpperCase()+l.slice(1)} (soon)</option>{/each}", "<option value=\"fabric\">Fabric</option>\n              <option value=\"forge\">Forge</option>\n              <option value=\"neoforge\">NeoForge</option>")
          s=s.replace("<small>Vanilla · Fabric · Forge</small>", "<small>Vanilla · Fabric · Forge · NeoForge</small>")
          p.write_text(s)
          PY
      - name: Commit patch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src-tauri/src/lib.rs src/App.svelte
          git commit -m "Patch launcher UI and loader resolver"
          git push
          rm -f .github/workflows/patch-launcher.yml
          git add .github/workflows/patch-launcher.yml
          git commit -m "Remove temporary launcher patch workflow"
          git push
